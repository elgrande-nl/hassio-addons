<!doctype html>
<html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bird Buddy</title>
<style>
:root{font-family:system-ui,sans-serif;color:#213d32;background:#f4f6ee}body{max-width:1200px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin-bottom:4px}button{background:#275c43;color:white;border:0;border-radius:24px;padding:12px 20px;cursor:pointer}#feeders,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px;margin:24px 0}.feeder,article{background:white;border-radius:18px;overflow:hidden;box-shadow:0 4px 20px #203d3209}.feeder,article .body{padding:20px}img,video{width:100%;max-height:400px;object-fit:contain;background:#e7ecdf;display:block}.muted{color:#596a60;font-size:.9rem}.error{color:#a12f27;white-space:pre-wrap}a{color:#275c43}h2{font-size:1.1rem}#error:empty{display:none}#refresh:disabled{opacity:.6}
</style>
<header><div><h1>Bird Buddy</h1><div class="muted">Een kijkje bij je gevleugelde bezoekers</div></div><button id="refresh">Nu verversen</button></header>
<p id="updated" class="muted">Status ophalen…</p><p id="error" class="error" role="status"></p><section id="feeders"></section><h2>Recente kaartjes</h2><p class="muted">Nieuwe kaartjes verschijnen na de volgende controle. Alleen media die Bird Buddy beschikbaar stelt wordt getoond.</p><section id="cards" class="cards"></section>
<script>
const $=id=>document.getElementById(id);
function element(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
const date=value=>value?new Date(value).toLocaleString('nl-NL'):'nog geen succesvolle controle';
let rendering='';
async function load(){try{const response=await fetch('api/state',{cache:'no-store'});if(!response.ok)throw Error('Status niet beschikbaar ('+response.status+')');const data=await response.json();$('updated').textContent='Laatste controle: '+date(data.last_success);$('error').textContent=data.error||'';
$('feeders').replaceChildren(...data.feeders.map(f=>{const box=element('div',undefined,'feeder');box.append(element('h2',f.name),element('p',f.state),element('p','Batterij: '+(f.battery??'onbekend')+(f.battery!=null?'%':'')+(f.charging?' · laden':'')),element('p','Wifi: '+(f.signal??'onbekend')+' · Firmware: '+(f.firmware??'onbekend'),'muted'));return box}));
const signature=JSON.stringify([data.cards,data.deliveries]);if(signature===rendering)return;rendering=signature;
$('cards').replaceChildren(...data.cards.map(card=>{const article=element('article');for(const media of card.media){const el=element(media.video?'video':'img');el.src='media/'+encodeURIComponent(media.file);if(media.video){el.controls=true;el.preload='none'}else{el.alt=card.title;el.loading='lazy'}article.append(el)}const body=element('div',undefined,'body');body.append(element('h2',card.title),element('p',date(card.created),'muted'));for(const m of card.media){const a=element('a',m.video?'Video opslaan':'Foto opslaan');a.href='media/'+encodeURIComponent(m.file);a.download=m.file;body.append(a,element('br'))}for(const d of data.deliveries.filter(d=>d.card===card.id)){body.append(element('p',d.destination+': '+(d.done?'afgehandeld':d.error?'wacht op nieuwe poging ('+d.error+')':'in wachtrij'),'muted'))}article.append(body);return article}));if(!data.cards.length)$('cards').append(element('p','Er zijn nog geen kaartjes opgeslagen.'));
}catch(err){$('error').textContent=err.message}}
$('refresh').onclick=async()=>{const b=$('refresh');b.disabled=true;try{const r=await fetch('api/refresh',{method:'POST',headers:{'X-BirdBuddy-UI':'1'}});if(!r.ok)throw Error('Verversen mislukt');$('updated').textContent='Controle aangevraagd…'}catch(e){$('error').textContent=e.message}finally{b.disabled=false}};
load();setInterval(load,15000);
</script></html>
